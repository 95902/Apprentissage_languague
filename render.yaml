services:
  # Backend API
  - type: web
    name: learning-platform-api
    env: node
    region: frankfurt  # Ou oregon, singapore selon votre localisation
    buildCommand: cd backend && npm install && npm run init-db
    startCommand: cd backend && npm start
    plan: free
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://your-frontend.vercel.app
      - key: DATABASE_PATH
        value: /opt/render/project/data/learning_platform.db
      - key: OLLAMA_URL
        value: http://localhost:11434
      - key: OLLAMA_MODEL
        value: disabled
    disk:
      name: data
      mountPath: /opt/render/project/data
      sizeGB: 1
